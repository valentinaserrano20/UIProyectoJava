<div class="container">
    <div class="explicacion">
        <p class="explicacion__titulo">Editar riesgo</p>
        <p class="explicacion__subtitulo">Editar los datos con la informacion del riesgo</p>
    </div>

    <div class="acordeon">
        <button class="acordeon__nombre">
            <div class="acordeon__iconoTitulo">
                <i class="ri-medicine-bottle-line acordeon__icono"></i>
                <p class="acordeon__titulo">Datos del riesgo</p>
            </div>
            <div class="acordeon__flecha">
                <i class="ri-arrow-down-s-line"></i>
            </div>
        </button>

        <div class="acordeon__contenido--oculto" id="acordeon__container">
            <form method="POST" class="form">

                <div class="input">
                    <div class="form__inputBox form__inputBox--selector">
                        <i class="ri-error-warning-line" id="selector__icono"></i>
                        <select class="selector" id="tiposAmenaza">
                            <option value="" hidden>Seleccione un tipo de amenaza...</option>
                        </select>
                    </div>
                </div>

                <div class="input">
                    <div class="form__inputBox">
                        <i class="ri-file-text-line"></i>
                        <textarea id="descripcion" placeholder="Descripcion" autocomplete="off"></textarea>
                    </div>
                </div>

                <div class="input">
                    <div class="form__inputBox">
                        <i class="ri-map-2-line"></i>
                        <input type="text" id="ubicacion" placeholder="Ubicación / Dirección" autocomplete="off">
                    </div>
                </div>

                <div class="input">
                    <div class="form__inputBox">
                        <i class="ri-map-pin-line"></i>
                        <input type="text" id="distancia" placeholder="Distancia (en metros)" autocomplete="off">
                    </div>
                </div>

                <button class="boton" id="botonGuardar" disabled>Guardar</button>

            </form>
        </div>
    </div>

    <div class="acordeon">
        <button class="acordeon__nombre">
            <div class="acordeon__iconoTitulo">
                <i class="ri-medicine-bottle-line acordeon__icono"></i>
                <p class="acordeon__titulo">Accion de reduccion</p>
            </div>
            <div class="acordeon__flecha">
                <i class="ri-arrow-down-s-line"></i>
            </div>
        </button>

        <div class="acordeon__contenido--oculto" id="acordeon__container">
            <div class="gestioarAfecciones">
                <div class="gestionarAfecciones__header">
                    <div class="gestionarAfecciones__titulo">
                        <i class="ri-capsule-line"></i>
                        <p>Lista de Acciones</p>
                    </div>
                    <button class="gestionarAcciones__boton gestionarAfecciones__boton boton">Agregar nueva</button>
                </div>

                <div class="gestionarAfecciones__lista gestionarAcciones__lista">
                </div>
            </div>
        </div>
    </div>

    <div class="acordeon">
        <button class="acordeon__nombre">
            <div class="acordeon__iconoTitulo">
                <i class="ri-medicine-bottle-line acordeon__icono"></i>
                <p class="acordeon__titulo">Vulnerabilidades</p>
            </div>
            <div class="acordeon__flecha">
                <i class="ri-arrow-down-s-line"></i>
            </div>
        </button>

        <div class="acordeon__contenido--oculto" id="acordeon__container">
            <div class="gestioarAfecciones">
                <div class="gestionarAfecciones__header">
                    <div class="gestionarAfecciones__titulo">
                        <i class="ri-capsule-line"></i>
                        <p>Lista de Vulnerabilidades</p>
                    </div>
                    <button class="gestionarVulnerabilidades__boton gestionarAfecciones__boton boton">Agregar nueva</button>
                </div>

                <div class="gestionarVulnerabilidades__lista gestionarAfecciones__lista">
                </div>
            </div>
        </div>
    </div>

</div>
