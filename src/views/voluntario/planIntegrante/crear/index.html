<div class="container">
    <div class="explicacion">
        <p class="explicacion__titulo">Integrantes de la familia</p>
        <p class="explicacion__subtitulo">Llene los datos con la informacion del integrante</p>
    </div>
<form method="POST" class="form">
    <div class="input">
        <div class="form__inputBox">
            <i class="ri-user-line"></i>
            <input type="text" placeholder="nombres" id="nombres" autocomplete="off"
            data-tipo="textoNombres">
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox">
            <i class="ri-user-line"></i>
            <input type="text" placeholder="apellidos" id="apellidos" autocomplete="off"
            data-tipo="textoNombres">
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox form__inputBox--selector">
            <i class="ri-id-card-line" id="selector__icono"></i>
            <select class="selector" id="tiposDocumento">
            <option value ="" hidden>Seleccione un tipo de documento...</option>
            </select>
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox">
            <i class="ri-info-card-line"></i>
            <input type="text" placeholder="numero de documento" id="numeroDocumento" autocomplete="off"
            data-tipo="documento">
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox form__inputBox--selector">
            <i class="ri-men-line" id="selector__icono"></i>
            <select class="selector" id="generos">
            <option value ="" hidden>Seleccione un genero...</option>
            </select>
        </div>
    </div>
    <div class="form__inputBox--double">
        <div class="input">
            <div class="form__inputBox">
                <i class="ri-cake-2-line"></i>
                <input type="date" placeholder="fecha de nacimiento" id="nacimiento" autocomplete="off"
                data-tipo="fecha">
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox">
                <i class="ri-health-book-line"></i>
                <input type="text" placeholder="eps" id="eps" autocomplete="off"
                data-tipo="textoCorto">
            </div>
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox form__inputBox--selector">
            <i class="ri-team-line" id="selector__icono"></i>
            <select class="selector" id="parentescos">
            <option value ="" hidden>Seleccione un parentesco...</option>
            </select>
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox form__inputBox--selector">
            <i class="ri-heart-pulse-line" id="selector__icono"></i>
            <select class="selector" id="grupoSanguineos">
            <option value ="" hidden>Seleccione un grupo sanguineo...</option>
            </select>
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox form__inputBox--selector">
            <i class="ri-flag-line" id="selector__icono"></i>
            <select class="selector" id="nacionalidades">
            <option value ="" hidden>Seleccione un nacionalidad...</option>
            </select>
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox">
            <i class="ri-phone-line"></i>
            <input type="text" placeholder="celular personal" id="celularPersonal" autocomplete="off"
            data-tipo="telefono">
        </div>
    </div>
    <button class="boton" id="botonGuardar" disabled>Guardar</button>
</form>
</div>
