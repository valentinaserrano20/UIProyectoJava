<div class="container">
    <div class="explicacion">
        <p class="explicacion__titulo">Mascotas o Animales</p>
        <p class="explicacion__subtitulo">Editar informacion y añadir vacunas</p>
    </div>

    <div class="acordeon">
        <button class="acordeon__nombre">
            <div class="acordeon__iconoTitulo">
                <i class="ri-user-line acordeon__icono"></i>
                <p class="acordeon__titulo">Datos de la mascota</p>
            </div>
            <div class="acordeon__flecha">
                <i class="ri-arrow-down-s-line"></i>
            </div>
        </button>

        <div class="acordeon__contenido--oculto" id="acordeon__container">

            <form method="POST" class="form">

                <div class="input">
                    <div class="form__inputBox form__inputBox--selector">
                        <i class="ri-bell-line" id="selector__icono"></i>
                        <select class="selector" id="especies">
                            <option value="" hidden>Seleccione un tipo de especie...</option>
                        </select>
                    </div>
                </div>

                <div class="input">
                    <div class="form__inputBox">
                        <i class="ri-coupon-line"></i>
                        <input type="text" id="nombre" placeholder="nombre" autocomplete="off" data-tipo="textoCorto">
                    </div>
                </div>

                <div class="form__inputBox--double">

                    <div class="input">
                        <div class="form__inputBox">
                            <i class="ri-dna-line"></i>
                            <input type="text" id="raza" placeholder="raza" autocomplete="off">
                        </div>
                    </div>

                    <div class="input">
                        <div class="form__inputBox">
                            <i class="ri-cake-2-line"></i>
                            <input type="date" id="edad" autocomplete="off" data-tipo="fecha">
                        </div>
                    </div>

                </div>

                <div class="input">
                    <div class="form__inputBox form__inputBox--selector">
                        <i class="ri-user-line" id="selector__icono"></i>
                        <select class="selector" id="generos">
                            <option value="" hidden>Seleccione Macho/Hembra...</option>
                        </select>
                    </div>
                </div>

                <button class="boton" id="botonGuardar" disabled>Guardar</button>

            </form>

        </div>
    </div>

    <div class="acordeon">

        <button class="acordeon__nombre">
            <div class="acordeon__iconoTitulo">
                <i class="ri-medicine-bottle-line acordeon__icono"></i>
                <p class="acordeon__titulo">Vacunas</p>
            </div>
            <div class="acordeon__flecha">
                <i class="ri-arrow-down-s-line"></i>
            </div>
        </button>

        <div class="acordeon__contenido--oculto" id="acordeon__container">

            <div class="gestioarAfecciones">

                <div class="gestionarAfecciones__header">
                    <div class="gestionarAfecciones__titulo">
                        <i class="ri-capsule-line"></i>
                        <p>Lista de Vacunas</p>
                    </div>

                    <button class="gestionarAfecciones__boton boton">Agregar nueva</button>
                </div>

                <div class="gestionarAfecciones__lista"></div>

            </div>

        </div>
    </div>

</div>
